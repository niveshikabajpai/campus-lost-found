<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Report - Campus Lost & Found</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .edit-page {
            min-height: 80vh;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .edit-card {
            width: 100%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.95);

            padding: 35px;

            border-radius: 22px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .edit-card h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #7b1e5a;
        }

        .edit-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .edit-card label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;

            font-weight: bold;
            color: #555;
        }

        .edit-card input,
        .edit-card select,
        .edit-card textarea {

            width: 100%;

            padding: 13px 15px;

            border: 2px solid #f0d4e7;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            font-family: Arial, sans-serif;
        }

        .edit-card input:focus,
        .edit-card select:focus,
        .edit-card textarea:focus {

            border-color: #a83279;
        }

        .edit-card textarea {
            min-height: 120px;
            resize: vertical;
        }

        .edit-buttons {
            margin-top: 25px;

            display: flex;
            gap: 12px;

            flex-wrap: wrap;
        }

        .save-btn {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #7b1e5a;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-btn:hover {
            background: #a83279;
        }

        .cancel-btn {
            flex: 1;

            padding: 13px;

            border-radius: 10px;

            background: #f8edf5;

            color: #7b1e5a;

            text-decoration: none;

            text-align: center;

            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #f1dbea;
        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Campus Lost & Found
        </div>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('items') }}">
                Find Items
            </a>

            <a href="{{ url_for('report') }}">
                Report
            </a>

            <a href="{{ url_for('how_it_works') }}">
                How It Works
            </a>

            {% if session.get("user_id") %}

                <span class="welcome">
                    Hi, {{ session.get("user_name") }} 👋
                </span>

                <a href="{{ url_for('logout') }}" class="logout-btn">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('login') }}" class="login-btn">
                    Login
                </a>

            {% endif %}

        </div>

    </nav>


    <!-- EDIT PAGE -->

    <section class="edit-page">

        <div class="edit-card">

            <h1>
                ✏️ Edit Report
            </h1>

            <p class="edit-subtitle">
                Update the details of your lost or found item.
            </p>


            <form method="POST">

                <label for="type">
                    Report Type
                </label>

                <select id="type" name="type" required>

                    <option value="Lost"
                        {% if item["type"] == "Lost" %}selected{% endif %}>
                        Lost
                    </option>

                    <option value="Found"
                        {% if item["type"] == "Found" %}selected{% endif %}>
                        Found
                    </option>

                </select>


                <label for="item_name">
                    Item Name
                </label>

                <input
                    type="text"
                    id="item_name"
                    name="item_name"
                    value="{{ item['item_name'] }}"
                    required
                >


                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ item['category'] or '' }}"
                    placeholder="Example: Electronics, Books, Accessories"
                >


                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ item['location'] }}"
                    required
                >


                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ item['date'] }}"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe the item..."
                >{{ item['description'] or '' }}</textarea>


                <div class="edit-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        💾 Save Changes
                    </button>

                    <a
                        href="{{ url_for('item_details', item_id=item['id']) }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            Campus Lost & Found • Making campus life easier 💗
        </p>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CampusFind</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ffe4f1, #f7d6ff);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 450px;

            background: rgba(255,255,255,0.95);

            padding: 40px;

            border-radius: 25px;

            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #7b1e5a;

            margin-bottom: 10px;
        }

        .purple {
            color: #a83279;
        }

        h1 {
            text-align: center;

            color: #333;

            margin: 15px 0 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-top: 18px;
            margin-bottom: 7px;

            font-weight: bold;

            color: #555;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border: 2px solid #f0d4e7;

            border-radius: 12px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #a83279;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: #7b1e5a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #a83279;

            transform: translateY(-2px);
        }

        .error {
            background: #ffe0ea;

            color: #d6336c;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            margin-bottom: 15px;

            font-size: 14px;
        }

        .signup {
            text-align: center;

            margin-top: 22px;

            color: #666;
        }

        .signup a {
            color: #7b1e5a;

            font-weight: bold;

            text-decoration: none;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #7b1e5a;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="logo">
            🎒 Campus<span class="purple">Find</span>
        </div>

        <h1>Create Your Account 💗</h1>

        <p class="subtitle">
            Join CampusFind and help reconnect lost items.
        </p>


        {% if error %}

            <div class="error">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Account ✨
            </button>

        </form>


        <div class="signup">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>


        <a class="back" href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</body>

</html>
